name: Supabase Keepalive

on:
  schedule:
    - cron: '0 7 */3 * *' # 07:00 UTC, every 3rd day — well inside the 7-day window
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl --silent --show-error --location \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/recipes?select=id&limit=1")
          echo "PostgREST responded ${code}"
          test "$code" -ge 200 && test "$code" -lt 400
